name: ci

# Concurrency: a new push to a branch cancels the in-flight run for that branch. Waiting
# for an obsolete build tells you nothing you did not already know.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fast gate. Everything here runs on every push and must stay under a couple of
  # minutes, because a gate nobody waits for is a gate people bypass.
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # gofmt -l prints files that differ; any output at all fails the step. The
        # diff is printed so the failure is actionable without a local checkout.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is a no-op
        # A dirty go.mod after tidy means the committed dependency set does not match
        # the imports, which makes builds irreproducible.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration tests
        run: go test ./... -count=1

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests with the race detector
        # The process and redaction code is concurrent by nature, so this is a real gate
        # rather than a formality.
        run: go test -race ./... -count=1

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A short run does not prove the parser is safe; it proves the harness works and
      # that no known crash was introduced. Longer campaigns belong on a schedule.
      - name: Fuzz the config parser
        run: go test -run=XXX -fuzz=FuzzParseConfig -fuzztime=30s ./internal/config/

      - name: Fuzz the key-position scanner
        run: go test -run=XXX -fuzz=FuzzScanKeyPositions -fuzztime=30s ./internal/config/

  security:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The toolchain line in go.mod pins the patch release, because the Go standard
      # library carries its own vulnerability advisories. A `go 1.25.0` directive alone
      # would happily build with a toolchain that has known net/http CVEs.
      - name: Show the resolved toolchain
        run: go version

      - name: govulncheck
        # Scans the dependency graph for known vulnerabilities reachable from our code.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Verify the module graph resolves
        run: go mod verify

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate coverage profile
        run: go test -coverprofile=coverage.out -covermode=atomic ./internal/... -count=1

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The platform split in internal/protocol is only exercised by compiling for the
      # other platforms, so this is a real check rather than a packaging step.
      - name: Build for every supported platform
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cmd/mcpdoctor
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go vet ./...
          done